name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_skills.py
      - run: python skills/bootstrap-repo/scripts/test_inspect_repo.py
      - run: python skills/implement-milestone/scripts/tests/test_contract_snapshot.py
      - run: python skills/fix-bug/scripts/capture_repro.py --help
      - run: python skills/review-repo/scripts/repo_inventory.py --help
