name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/validate_skills.py
      - run: python scripts/test_protocol_contracts.py
      - run: python skills/bootstrap-repo/scripts/test_inspect_repo.py
      - run: python skills/bootstrap-repo/scripts/test_github_templates.py
      - run: node skills/bootstrap-repo/scripts/test_issue_finalize.js
      - run: python skills/create-issue/scripts/test_gh_issue.py
      - run: python skills/fix-bug/scripts/capture_repro.py --help
      - run: python skills/review-repo/scripts/repo_inventory.py --help
      - run: python skills/review-repo/evals/build_fixtures.py
